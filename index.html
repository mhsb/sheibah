<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hosein Sheibah · Sheibah</title>
<meta name="description" content="Hawzah studies, translation, and code.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230b2a6b'/%3E%3C/svg%3E">
<style>
:root{--paper:#f7f2e5;--surface:#fff;--ink:#0b1b3d;--soft:#334155;--line:#d8d0b8;--lapis:#0b2a6b;--turq:#0aa6a6;--turq-d:#05696b;--saff:#f2b134;--ff:'Vazirmatn',system-ui,sans-serif;--fd:'Lalezar','Vazirmatn',system-ui,sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:1rem/1.8 var(--ff);min-height:100vh;display:flex;flex-direction:column}
main{flex:1;outline:0}.wrap{max-width:72rem;margin:0 auto;padding-inline:1.25rem}
a{color:var(--turq-d)}:focus-visible{outline:3px solid var(--lapis);outline-offset:3px;border-radius:4px}
h1,h2{font-family:var(--fd);font-weight:400;line-height:1.3;margin:0 0 .75rem;color:var(--lapis);text-wrap:balance}h1{font-size:clamp(2rem,5vw,2.75rem)}h2{font-size:1.75rem}
p{margin:0 0 1rem}.muted{color:var(--soft);font-size:.9rem}.lede{font-size:1.15rem;color:var(--soft);max-width:48ch}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;inset-inline-start:1rem;top:-4rem;background:var(--lapis);color:#fff;padding:.5rem 1rem;z-index:9}.skip:focus{top:1rem}
header{--p:0;position:fixed;inset:0 0 auto 0;z-index:5;background:var(--lapis);overflow:hidden;border-radius:0 0 28px 28px;padding-top:calc(2.2rem - 1.7rem*var(--p))}header :focus-visible{outline-color:var(--saff)}
#sp{flex:none;height:20rem}


nav{position:relative}nav ul{list-style:none;margin:0;padding:.3rem 1rem .2rem;display:flex;gap:1.25rem;overflow-x:auto;justify-content:safe center}
nav a{display:block;padding:.5rem 0;color:#cfe0ff;text-decoration:none;font-weight:600;white-space:nowrap;border-bottom:3px solid transparent}nav a:hover{color:#fff}nav a[aria-current]{color:#fff;border-color:var(--saff)}
.tg{position:absolute;top:.1rem;right:.75rem;z-index:2;display:flex;gap:.5rem;align-items:center;font-size:.9rem;font-weight:700;color:#fff}.tg button{background:none;border:0;padding:.7rem .4rem;color:var(--saff);font:inherit;cursor:pointer;text-decoration:underline}

.st{position:absolute;top:-110px;right:-120px;animation:sp 70s linear infinite;opacity:.55}.st2{position:absolute;bottom:20px;left:-90px;animation:sp 90s linear infinite reverse;opacity:.4}
@keyframes sp{to{transform:rotate(360deg)}}

.st,.st2{pointer-events:none}
.mh{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;text-decoration:none;color:var(--ink);margin-inline:auto;width:calc(21rem - 14rem*var(--p));max-width:calc(100% - 2.5rem);background:none;padding:calc(1rem + 6.6rem*(1 - var(--p))) .9rem calc(.3rem + 1rem*(1 - var(--p)))}
.ar{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.af{fill:var(--paper)}.mu path{stroke:var(--turq);stroke-width:.8;vector-effect:non-scaling-stroke}.mu,.mb{opacity:calc(1 - var(--p)*1.6)}.ab{fill:none;stroke:#1c55c4;stroke-width:14;vector-effect:non-scaling-stroke}
.al{fill:none;stroke:var(--turq);stroke-width:4;vector-effect:non-scaling-stroke}.al2{fill:none;stroke:var(--saff);stroke-width:1.5;vector-effect:non-scaling-stroke}
.mh>:not(.ar){position:relative;z-index:1}
.meta{overflow:hidden;max-height:calc(7rem*(1 - var(--p)));opacity:calc(1 - var(--p)*1.8)}header.c .meta{visibility:hidden}
.logo{display:block;height:calc(5.5rem - 3rem*var(--p));width:auto;max-width:100%;margin-bottom:calc(.5rem*(1 - var(--p)))}
.mark{display:block;font:400 calc(3.6rem - 1.7rem*var(--p))/1.1 var(--fd);color:var(--lapis)}
.nm{font-weight:800;font-size:1.25rem;line-height:1.5;margin:0;color:var(--ink)}.tg2{font-size:.95rem;line-height:1.5;color:var(--soft);margin:.25rem 0 0}
.wrap>.cta-row{justify-content:center;margin-top:1.75rem}.cta-row{display:flex;flex-wrap:wrap;gap:.75rem}
.btn{display:inline-block;padding:.75rem 2rem;border-radius:16px;background:var(--saff);color:var(--lapis);border:2px solid var(--lapis);box-shadow:0 4px 0 var(--lapis);font-family:inherit;font-weight:800;font-size:1rem;text-decoration:none;cursor:pointer;transition:transform .2s}
.btn:hover{transform:translateY(-3px)}.btn.ghost{background:#fff;box-shadow:none;color:var(--lapis)}.btn.ghost:hover{box-shadow:0 4px 0 var(--turq)}
.grid{display:grid;gap:1.75rem;grid-template-columns:repeat(auto-fit,minmax(17rem,1fr));padding-block:2.5rem}
.panel{background:var(--surface);border:2px solid var(--lapis);border-radius:70px 70px 18px 18px;padding:2.5rem 1.5rem 1.25rem;text-align:center;display:flex;flex-direction:column;box-shadow:0 6px 0 var(--turq);transition:transform .25s}
.panel:nth-child(even){box-shadow:0 6px 0 var(--saff)}.panel:hover{transform:translateY(-4px)}
.panel ul{list-style:none;padding:0;margin:0 0 .75rem;display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center}
.panel li a{display:flex;align-items:center;min-height:44px;padding:0 1rem;border-radius:12px;background:#e3f6f6;color:#05565a;font-weight:600;font-size:.9rem;text-decoration:none;transition:background .2s}.panel li a:hover{background:var(--saff);color:var(--lapis)}
.act{margin:auto 0 0}
.page{padding-block:2.5rem 4rem}
.cards{display:grid;gap:1.25rem;grid-template-columns:repeat(auto-fit,minmax(18rem,1fr))}
.cards>div{background:var(--surface);border:2px solid var(--lapis);border-radius:18px 18px 18px 40px;padding:1.25rem;box-shadow:0 5px 0 var(--turq);display:flex;flex-direction:column;transition:transform .2s}.cards>div:hover{transform:translateY(-3px)}
.cards>div.feat{box-shadow:0 5px 0 var(--saff)}
.cards h2{font-size:1.4rem}.cards .cta-row .btn{margin-top:0}
.badge{align-self:flex-start;background:var(--saff);color:var(--lapis);font-weight:800;font-size:.8rem;line-height:1.7;padding:0 .75rem;border-radius:99px;margin-bottom:.5rem}
.rows>*{padding-block:1.25rem;border-bottom:1px solid var(--line)}.rows>*:first-child{border-top:1px solid var(--line)}
summary{cursor:pointer;display:flex;justify-content:space-between;gap:1rem;align-items:baseline}summary .t{font-size:1.25rem;font-weight:700}
.prose{max-width:68ch;font-size:1.125rem;line-height:1.8;padding-top:1rem}.prose[dir=rtl]{line-height:2.05}
.links{list-style:none;padding:0;display:grid;gap:.75rem;max-width:30rem}
.links .btn,.links .btn.ghost{display:flex;justify-content:space-between;align-items:center;min-height:3.75rem;background:#fff;color:var(--lapis);box-shadow:none;border-radius:18px 18px 18px 40px;font-size:1.1rem}
.links .btn::after{content:'‹';font-size:1.6rem}html[dir=ltr] .links .btn::after{content:'›'}.links .btn:hover{box-shadow:0 5px 0 var(--turq)}
footer{background:var(--surface);border-top:2px solid var(--lapis);padding-block:1.25rem}footer p{margin:0}
.flinks{list-style:none;margin:0 0 .75rem;padding:0;display:flex;flex-wrap:wrap;gap:1.25rem}.flinks a{color:var(--lapis);font-weight:600}
label{display:block;margin-bottom:.75rem;font-weight:600}input,textarea,select{display:block;width:100%;margin-top:.25rem;padding:.6rem;border:2px solid var(--line);border-radius:10px;font:inherit;background:#fff;color:var(--ink)}textarea{min-height:7rem}
label.chk{display:flex;align-items:center;gap:.6rem;cursor:pointer}label.chk input{display:inline-block;width:1.4rem;height:1.4rem;margin:0;padding:0;accent-color:var(--lapis)}
.item{border:2px solid var(--line);border-radius:14px;padding:.75rem;margin-bottom:.75rem;background:#fff}.item summary{font-weight:700}.sec{margin-block:1.5rem}.sec>h2{font-size:1.4rem}.danger{color:#9b1c1c;border-color:#9b1c1c}#msg{font-weight:700}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.pi,.pm{width:64px;height:64px;border-radius:18px;border:2px solid var(--lapis);flex:none;margin-bottom:.75rem}.pi{object-fit:cover;background:#fff}
.pm{display:grid;place-items:center;background:var(--lapis);color:var(--saff);font:400 2rem/1 var(--fd)}.up{font-size:.9rem;color:var(--soft)}

/* ---- blog feed, tabs, motion ---- */
nav ul{position:relative}nav a{border-bottom:0;transition:color .25s}nav a[aria-current]{border-color:transparent}
.ind{position:absolute;bottom:.05rem;left:0;height:3px;width:0;background:var(--saff);border-radius:3px;transition:transform .45s cubic-bezier(.2,.8,.2,1),width .45s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.prog{position:absolute;left:0;right:0;bottom:0;height:3px;transform-origin:left;transform:scaleX(var(--sx,0));background:linear-gradient(90deg,var(--turq),var(--saff))}html[dir=rtl] .prog{transform-origin:right}
header::before,header::after{content:'';position:absolute;z-index:-1;border-radius:50%;pointer-events:none}
header::before{width:26rem;height:26rem;inset-inline-end:-9rem;top:-12rem;background:radial-gradient(circle,rgba(10,166,166,.42),transparent 65%);animation:drift 16s ease-in-out infinite alternate}
header::after{width:18rem;height:18rem;inset-inline-start:-7rem;bottom:-9rem;background:radial-gradient(circle,rgba(242,177,52,.26),transparent 65%);animation:drift 20s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(-5rem,4rem) scale(1.25)}}
main.pg{animation:pg .5s cubic-bezier(.2,.8,.2,1)}@keyframes pg{from{opacity:0;transform:translateY(14px)}}
.rv{opacity:0}.rv.in{opacity:1;animation:up .65s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*70ms)}
@keyframes up{from{opacity:0;transform:translateY(26px) scale(.97)}}
.feedh{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;margin-block:2rem 1.25rem}.feedh h1{margin:0}
.feed{display:grid;gap:1.4rem;grid-template-columns:repeat(auto-fill,minmax(min(100%,19rem),1fr));padding-bottom:3.5rem}
.card{--mx:50%;--my:50%;--c:var(--turq);position:relative;display:flex;flex-direction:column;gap:.7rem;padding:1.25rem;background:var(--surface);border:2px solid var(--lapis);border-radius:20px 20px 20px 44px;box-shadow:0 5px 0 var(--c);color:inherit;text-decoration:none;overflow:hidden;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
.card::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(16rem circle at var(--mx) var(--my),color-mix(in srgb,var(--c) 22%,transparent),transparent 65%)}
.card:hover{transform:translateY(-6px);box-shadow:0 11px 0 var(--c)}.card:hover::before{opacity:1}.card:active{transform:translateY(-2px) scale(.99)}
.card>*{position:relative}.card h2{font-size:1.4rem;margin:0}.card p{margin:0;color:var(--soft);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.t-article{--c:var(--lapis)}.t-translation{--c:var(--turq)}.t-project{--c:var(--saff)}
.top{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}.card .top time{margin-inline-start:auto}
.th{width:3rem;height:3rem;border-radius:14px;display:grid;place-items:center;flex:none;overflow:hidden;color:var(--lapis);background:color-mix(in srgb,var(--c) 18%,#fff);border:2px solid var(--lapis);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.th img{width:100%;height:100%;object-fit:cover}.card:hover .th{transform:rotate(-7deg) scale(1.1)}.th.big{width:4.25rem;height:4.25rem;border-radius:18px}
.badge{display:inline-flex;align-items:center;padding:.05rem .75rem;border-radius:99px;font-weight:700;font-size:.8rem;background:var(--c);color:#fff}.t-translation .badge{color:var(--ink)}.t-project .badge{color:var(--lapis)}
@media(min-width:48rem){.card.big{grid-column:span 2}.card.big h2{font-size:1.75rem}}
.post .lede{max-width:60ch}.post h1{margin-block:1rem .5rem}.post>p a{font-weight:700;text-decoration:none}.post .cta-row{margin-block:1rem 1.5rem}
.btn{transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}.btn:active{transform:translateY(1px) scale(.97)}
.links .btn{transition:transform .25s,box-shadow .25s}

/* ---- soft gradients instead of flat colour ---- */
:root{--g-lapis:linear-gradient(135deg,#0b2a6b,#1a4aa8);--g-turq:linear-gradient(135deg,#6fdcd2,#0aa6a6);--g-saff:linear-gradient(135deg,#ffe099,#f2b134)}
body{background:radial-gradient(42rem 30rem at 90% -4%,rgba(10,166,166,.16),transparent 62%),radial-gradient(36rem 28rem at -6% 38%,rgba(242,177,52,.18),transparent 62%),radial-gradient(44rem 32rem at 104% 88%,rgba(59,123,224,.14),transparent 62%),linear-gradient(180deg,#faf6ec,#f3eddf)}
header{background:radial-gradient(60rem 22rem at 100% 0,rgba(10,166,166,.35),transparent 60%),linear-gradient(160deg,#0a2766 0%,#123a8c 55%,#1c5aaa 100%)}
.af{fill:url(#gf)}.ab{stroke:url(#gb)}.al{stroke:url(#gl)}
.ind{background:var(--g-saff);box-shadow:0 0 10px rgba(242,177,52,.7)}
.card{border:1px solid color-mix(in srgb,var(--c) 38%,transparent);border-radius:26px;background:linear-gradient(160deg,#fff 0%,color-mix(in srgb,var(--c) 11%,#fffdf8) 100%);box-shadow:0 14px 34px -16px color-mix(in srgb,var(--c) 55%,transparent),0 2px 6px rgba(11,42,107,.06)}
.card:hover{box-shadow:0 24px 46px -18px color-mix(in srgb,var(--c) 65%,transparent),0 3px 8px rgba(11,42,107,.08)}
.th{border:1px solid color-mix(in srgb,var(--c) 40%,transparent);background:linear-gradient(135deg,color-mix(in srgb,var(--c) 30%,#fff),color-mix(in srgb,var(--c) 8%,#fff));box-shadow:0 6px 14px -8px color-mix(in srgb,var(--c) 70%,transparent)}
.badge{background:linear-gradient(135deg,color-mix(in srgb,var(--c) 70%,#fff),var(--c))}
.t-article .badge{background:var(--g-lapis);color:#fff}.t-translation .badge{background:var(--g-turq)}.t-project .badge{background:var(--g-saff)}
.btn{background:var(--g-saff);color:var(--lapis);border:0;box-shadow:0 10px 22px -10px rgba(242,177,52,.9),inset 0 1px 0 rgba(255,255,255,.55)}
.btn:hover{filter:brightness(1.05);box-shadow:0 14px 26px -10px rgba(242,177,52,.95),inset 0 1px 0 rgba(255,255,255,.6)}
.btn.ghost{background:linear-gradient(160deg,rgba(255,255,255,.9),rgba(255,255,255,.55));border:1px solid rgba(11,42,107,.25);box-shadow:0 8px 18px -12px rgba(11,42,107,.5)}
.btn.ghost:hover{box-shadow:0 12px 24px -12px rgba(11,42,107,.55)}
.links .btn,.links .btn.ghost{background:linear-gradient(160deg,#fff,#f5efe0);border:1px solid rgba(11,42,107,.18);border-radius:20px;box-shadow:0 10px 24px -14px rgba(11,42,107,.45)}
.links .btn:hover{box-shadow:0 16px 28px -14px rgba(10,166,166,.6)}
footer{background:linear-gradient(180deg,rgba(255,255,255,.7),rgba(255,255,255,.95));border-top:1px solid rgba(11,42,107,.12)}
.item{border:1px solid rgba(11,42,107,.15);border-radius:18px;background:linear-gradient(160deg,#fff,#faf6ec);box-shadow:0 8px 20px -14px rgba(11,42,107,.4)}
input,textarea,select{border:1px solid rgba(11,42,107,.2);border-radius:12px}
.pi,.pm{border:1px solid rgba(11,42,107,.25);box-shadow:0 6px 14px -8px rgba(11,42,107,.5)}.pm{background:var(--g-lapis)}
.mh,#cp{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}.mh img{-webkit-user-drag:none}
/* header elevation: layered soft shadow, deeper while the hero is expanded */
header{box-shadow:0 calc(12px + 16px*(1 - var(--p,1))) calc(26px + 26px*(1 - var(--p,1))) -12px rgba(8,28,80,.5),0 4px 10px -4px rgba(8,28,80,.35),0 1px 0 rgba(255,255,255,.08) inset}

/* ---- markdown content ---- */
.prose h2{font-size:1.6rem;margin:2rem 0 .75rem}.prose h3{font-size:1.3rem;margin:1.6rem 0 .6rem}.prose h4,.prose h5,.prose h6{font-size:1.1rem;margin:1.3rem 0 .5rem}
.prose blockquote{margin:1.2rem 0;padding:.4rem 1.1rem;border-inline-start:4px solid var(--turq);background:linear-gradient(90deg,rgba(10,166,166,.1),transparent);border-radius:12px;color:var(--soft)}
.prose ul,.prose ol{padding-inline-start:1.5rem;margin:0 0 1rem}.prose ul{list-style:disc}
.prose pre{overflow-x:auto;padding:1rem;border-radius:14px;background:#0f1b3d;color:#e8eefc;text-align:left;font-size:.95rem}
.prose code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9em;background:rgba(11,42,107,.08);padding:.1em .35em;border-radius:6px}.prose pre code{background:none;padding:0}
.prose img{max-width:100%;height:auto;border-radius:14px;margin:1rem 0;box-shadow:0 14px 30px -18px rgba(11,42,107,.5)}
.prose table{border-collapse:collapse;display:block;overflow-x:auto;margin:1rem 0}.prose th,.prose td{border:1px solid rgba(11,42,107,.2);padding:.45rem .8rem}.prose th{background:rgba(11,42,107,.06)}
.prose hr{border:0;border-top:1px solid rgba(11,42,107,.2);margin:2rem 0}.prose a{word-break:break-word}
label.chk{display:flex;gap:.6rem;align-items:flex-start;font-weight:500}label.chk input{width:auto;margin-top:.35rem}

/* ---- admin v2 ---- */
body.adm #hd,body.adm #ft{display:none}body.adm #sp{height:0!important}
.adm{max-width:74rem;margin:0 auto;padding-bottom:7rem;font-family:var(--ff);color:var(--ink)}
.atop{position:sticky;top:0;z-index:20;background:linear-gradient(160deg,#0a2766,#1c5aaa);box-shadow:0 14px 28px -16px rgba(8,28,80,.75)}
.abar{display:flex;align-items:center;gap:.6rem;padding:.55rem 1rem;padding-top:max(.55rem,env(safe-area-inset-top));color:#fff}
.abar b{flex:1;font-size:1.1rem}.aback{color:#cfe0ff;text-decoration:none;padding:.6rem .2rem;font-weight:600}
.chip{font-size:.75rem;padding:.2rem .65rem;border-radius:99px;background:rgba(255,255,255,.16);white-space:nowrap}.chip.warn{background:var(--g-saff);color:var(--lapis);font-weight:700}
.abar .btn{padding:.5rem 1.1rem;min-height:2.6rem;white-space:nowrap}.btn[disabled]{opacity:.45;filter:grayscale(.5);cursor:default;transform:none;box-shadow:none}
.atabs{display:flex;gap:.45rem;padding:.2rem 1rem .75rem;overflow-x:auto;scrollbar-width:none}
.atabs button{flex:none;min-height:2.6rem;padding:0 1.15rem;border-radius:99px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#e2ecff;font:inherit;font-weight:700;cursor:pointer;transition:background .25s,color .25s}
.atabs button.on{background:#fff;color:var(--lapis);border-color:#fff}
.abody{padding:1rem}.split{display:grid;gap:1rem}.single{max-width:44rem;margin:0 auto}
.ptools{display:grid;gap:.6rem;margin-bottom:.9rem}.ptools input{width:100%;min-height:2.9rem;padding:.6rem .95rem;font:inherit;font-size:1rem;border:1px solid rgba(11,42,107,.2);border-radius:99px;background:#fff}
.chips{display:flex;gap:.4rem;overflow-x:auto;scrollbar-width:none}.chips button{flex:none;min-height:2.4rem;padding:0 1rem;border-radius:99px;border:1px solid rgba(11,42,107,.2);background:#fff;font:inherit;font-weight:600;color:var(--lapis);cursor:pointer}
.chips button.on{background:var(--g-lapis);color:#fff;border-color:transparent}
.prow{display:flex;gap:.8rem;align-items:center;width:100%;text-align:start;padding:.7rem .85rem;margin-bottom:.6rem;min-height:4.2rem;border-radius:20px;border:1px solid rgba(11,42,107,.12);background:linear-gradient(160deg,#fff,#faf6ec);font:inherit;color:inherit;cursor:pointer;box-shadow:0 8px 20px -16px rgba(11,42,107,.6);transition:transform .2s,box-shadow .2s,border-color .2s}
.prow:active{transform:scale(.985)}.prow.on{border-color:var(--turq);box-shadow:0 12px 26px -14px rgba(10,166,166,.7)}
.pt{display:flex;flex-direction:column;min-width:0}.pt b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pt small{color:var(--soft)}
.empty{color:var(--soft);text-align:center;padding:1.5rem}.empty.big{padding:4rem 1rem}
.card2{background:linear-gradient(160deg,#fff,#faf6ec);border:1px solid rgba(11,42,107,.12);border-radius:22px;padding:1rem 1.1rem;margin-bottom:1rem;box-shadow:0 12px 28px -20px rgba(11,42,107,.55)}
.card2 h3{font-size:1rem;margin:0 0 .85rem;color:var(--lapis)}.card2 h2{margin:0 0 .6rem}

/* ---------- tiny safe Markdown renderer (HTML in the text is escaped, never executed) ---------- */
function md(src){

 const flush=()=>{if(pa.length){o+=`<p dir="auto">${inl(pa.join('\n')).replace(/\n/g,'<br>')}</p>`;pa=[]}};
 const cells=l=>l.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
 while(i<L2.length){const l=L2[i];let m;

   o+=`<table><thead><tr>${h.map(c=>`<th>${inl(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${inl(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;continue}
  if(!l.trim()){flush();i++;continue}

function fm(t){t=String(t||'').replace(/^\uFEFF/,'').replace(/\r/g,'');const m=t.match(/^---\n([\s\S]*?)\n---\n?/),meta={};let body=t;
 if(m){body=t.slice(m[0].length);m[1].split('\n').forEach(l=>{const k=l.match(/^([A-Za-z_]+):\s*(.*)$/);if(k)meta[k[1].toLowerCase()]=k[2].replace(/^["']|["']$/g,'').trim()})}

const pages={

 robots(r==='admin'||(hx&&hx.listed===false)?'noindex,nofollow':'');

async function findIcon(pageUrl){
 const abs=(u,b)=>{try{return new URL(u,b).href}catch{return null}};

 const base=r.url||pageUrl,doc=new DOMParser().parseFromString(await r.text(),'text/html'),c=[];

 if(man){try{const mu=abs(man.getAttribute('href'),base),m=await(await fetch(mu)).json();(m.icons||[]).forEach(i=>c.push([sz(i.sizes)-(/maskable/.test(i.purpose||'')&&!/any/.test(i.purpose||'')?1000:0),abs(i.src,mu)]))}catch{}}
 doc.querySelectorAll('link[rel~=apple-touch-icon]').forEach(l=>c.push([sz(l.getAttribute('sizes'))||180,abs(l.getAttribute('href'),base)]));

const PROMPT=`تو دستیار تنظیم محتوای یک وب‌لاگ شخصی دوزبانه (فارسی/انگلیسی) هستی. بر اساس «اطلاعات من» که در پایان این پیام می‌آید، فقط یک JSON معتبر تولید کن.

قواعد خروجی:
- فقط خود JSON؛ بدون توضیح، بدون بک‌تیک و بدون کامنت.
- فقط این کلیدهای سطح اول مجازند: profile، links، posts. بخشی را که تغییر نمی‌دهم نیاور.
- هر پست یکی از سه نوع است: "article" (مقاله)، "translation" (ترجمه)، "project" (پروژه).
- عنوان و خلاصه‌ی هر پست دوزبانه باشد (title.fa و title.en، desc.fa و desc.en). ترجمه را طبیعی و روان بنویس، نه تحت‌اللفظی.
- خلاصه ۱ تا ۳ جمله باشد.
- date به شکل YYYY-MM-DD باشد (تاریخ انتشار یا آخرین به‌روزرسانی). اگر نمی‌دانی، خالی بگذار.
- برای article، متن کامل را در body بنویس (مارک‌داون مجاز است: سرتیتر با #، لیست، لینک، نقل‌قول؛ پاراگراف‌ها با یک خط خالی، یعنی \\n\\n، جدا شوند؛ HTML ننویس) و زبان آن را در lang بگذار ("fa" یا "en").
- listed را true بگذار تا پست در فهرست صفحه‌ی اصلی بیاید؛ false یعنی پست فقط با لینک مستقیم باز می‌شود.
- برای translation، url لینک محل انتشار ترجمه است. برای project، url لینک دمو و repo آدرس گیت‌هاب است.
- آدرس‌ها کامل و با https:// باشند. آدرسی را که نمی‌دانی حدس نزن؛ رشته‌ی خالی بگذار.
- در links آیتم اول دکمه‌ی «ارتباط با من» است؛ مهم‌ترین راه ارتباطی را اول بگذار.
- فیلدهای id و image را نیاور (خودکار ساخته می‌شوند).
- چیزی درباره‌ی من اختراع نکن؛ فقط از اطلاعاتی که می‌دهم استفاده کن. اگر اطلاعاتی کم بود، همان فیلد را خالی بگذار.

{
 "profile": { "brandFa": "", "nameFa": "", "nameEn": "", "tagline": {"en": "", "fa": ""}, "bio": {"en": "", "fa": ""} },
 "links": [ { "label": "", "url": "" } ],
 "posts": [ { "type": "article", "title": {"fa": "", "en": ""}, "desc": {"fa": "", "en": ""}, "date": "", "listed": true, "body": "", "lang": "fa", "url": "", "repo": "" } ]
}

JSON فعلی سایت (برای حفظ سبک و داده‌های موجود):
{{JSON}}

اطلاعات من:
(اینجا بنویس)`;

function toolsView(){return `<div class="ped single"><section class="card2"><h3>درون‌ریزی</h3><label class="fl">JSON را بچسبان (مثلاً خروجی هوش مصنوعی)<textarea id="imp" dir="ltr" rows="6" placeholder='{"profile":{…},"posts":[…]}'></textarea></label><label class="sw"><input type="checkbox" id="impa"><i></i><span><b>به موارد فعلی اضافه کن</b><small>اگر خاموش باشد، لینک‌ها و پست‌ها جایگزین می‌شوند</small></span></label><div class="imgbtn"><button class="btn sm" data-imp="1">اعمال روی فرم‌ها</button><label class="btn ghost sm upb">فایل JSON<input type="file" id="impf" accept=".json,application/json" hidden></label><label class="btn ghost sm upb">فایل‌های مارکداون (هر کدام یک پست)<input type="file" id="mdf" accept=".md,.markdown,text/markdown,text/plain" multiple hidden></label></div></section>
 <section class="card2"><h3>برای هوش مصنوعی</h3><div class="imgbtn"><button class="btn ghost sm" data-prompt="1">کپی پرامپت آماده</button><button class="btn ghost sm" data-copy="1">کپی JSON فعلی</button></div></section>
 <section class="card2"><h3>حساب</h3><p class="muted">توکن گیت‌هاب فقط در همین مرورگر ذخیره شده است.</p><button class="btn ghost sm dg" id="out">خروج و پاک کردن توکن</button></section></div>`}

function view(){if(!E)return;const sel=TAB==='posts'&&SEL?E.posts.find(p=>p.id===SEL):null;if(TAB==='posts'&&SEL&&!sel)SEL=null;
 document.body.classList.toggle('sel',!!sel);
 const inner=TAB==='posts'?postsView(sel):TAB==='profile'?profileView():TAB==='links'?linksView():toolsView();
 $('#main').innerHTML=`<div class="adm" dir="rtl" lang="fa"><div class="atop"><div class="abar"><a class="aback" href="#home">‹ سایت</a><b>مدیریت</b><span id="dchip" class="chip${DIRTY?' warn':''}">${DIRTY?'تغییرات ذخیره‌نشده':'ذخیره‌شده'}</span><button class="btn" id="asave"${DIRTY&&!SAVING?'':' disabled'}>${SAVING?'در حال ذخیره…':'ذخیره و انتشار'}</button></div><nav class="atabs" aria-label="بخش‌ها">${[['posts','پست‌ها'],['profile','پروفایل'],['links','لینک‌ها'],['tools','ابزارها']].map(([k,l])=>`<button data-tab="${k}" class="${TAB===k?'on':''}">${l}</button>`).join('')}</nav></div><div class="abody">${inner}</div></div>`;
 grow()}
function draw(){view()}

function loginView(){document.body.classList.remove('sel');$('#main').innerHTML=`<div class="adm login" dir="rtl" lang="fa"><div class="card2"><h2>ورود به مدیریت</h2><p class="muted">توکن گیت‌هاب (fine-grained، فقط همین ریپو، دسترسی Contents: Read and write) را وارد کن. فقط در همین مرورگر ذخیره می‌شود.</p><label class="fl">توکن<input id="tk" type="password" dir="ltr" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="github_pat_…"></label><label class="chk2"><input type="checkbox" id="tks"> نمایش توکن</label><button class="btn" id="go">ورود</button><p style="margin:1rem 0 0"><a href="#home">‹ بازگشت به سایت</a></p></div></div>`;
 const go=()=>{const v=$('#tk').value.trim();if(v){ls.set('token',v);E=null;admin()}};$('#go').onclick=go;$('#tk').onkeydown=e=>{if(e.key==='Enter')go()};$('#tks').onchange=e=>{$('#tk').type=e.target.checked?'text':'password'}}
function errorView(m){$('#main').innerHTML=`<div class="adm login" dir="rtl" lang="fa"><div class="card2"><h2>مشکل در ورود</h2><p style="color:#9b1c1c;font-weight:600">${esc(m)}</p><div class="imgbtn"><button class="btn" id="retry">تلاش دوباره</button><button class="btn ghost dg" id="chg">خروج و تغییر توکن</button></div><p style="margin:1rem 0 0"><a href="#home">‹ بازگشت به سایت</a></p></div></div>`;$('#retry').onclick=()=>admin();$('#chg').onclick=()=>{ls.del('token');admin()}}

function mdIns(spec){const t=$('#bd');if(!t)return;const s=t.selectionStart,e=t.selectionEnd,v=t.value;
 if(spec.includes('|')){const[a,b]=spec.split('|'),sel=v.slice(s,e)||'متن';t.value=v.slice(0,s)+a+sel+b+v.slice(e);t.focus();t.setSelectionRange(s+a.length,s+a.length+sel.length)}
 else{const st=v.lastIndexOf('\n',s-1)+1;t.value=v.slice(0,st)+spec+v.slice(st);t.focus();t.setSelectionRange(s+spec.length,e+spec.length)}
 t.dispatchEvent(new Event('input',{bubbles:true}))}
const clip=(tx,ok)=>navigator.clipboard.writeText(tx).then(()=>toast(ok)).catch(()=>{const i=$('#lk')||$('#imp');if(i){i.value=tx;i.select()}toast('کپی خودکار نشد؛ متن آماده‌ی کپی است',1)});

async function save(){if(SAVING||!DIRTY)return;
 const bad=[E.links,E.posts].flatMap(a=>(a||[]).flatMap(x=>[x.url,x.repo])).find(u=>u&&!/^https?:\/\//i.test(u));
 if(bad)return toast('آدرس‌ها باید با https:// شروع شوند: '+bad,1);
 if((E.links||[]).some(l=>!l.url))return toast('هر لینک باید آدرس داشته باشد',1);
 const nt=(E.posts||[]).find(p=>!t0(p.title).trim());if(nt){TAB='posts';SEL=nt.id;view();return toast('این پست عنوان ندارد',1)}
 SAVING=true;view();
 try{for(const pr of(E.posts||[])){if(pr.type==='project'&&pr.url&&!pr.image&&!TRIED.has(pr.url)){TRIED.add(pr.url);try{toast('در حال گرفتن آیکون '+t0(pr.title)+'…');pr.image=await iconFor(pr.url)}catch{}}}
  const r=await gh('PUT',{message:'Update content via admin',branch:D.branch||'main',sha:SHA,content:btoa(unescape(encodeURIComponent(JSON.stringify(E,null,2)+'\n')))});
  SHA=r.content.sha;D=JSON.parse(JSON.stringify(E));DIRTY=false;ls.del('sheibah:draft');SAVING=false;view();toast('ذخیره شد ✓ تا حدود یک دقیقه دیگر روی سایت دیده می‌شود.')}
 catch(err){SAVING=false;DIRTY=true;view();toast(err.message,1)}}

function attach(){const m=$('#main');
 m.oninput=e=>{const t=e.target;if(t.id==='q'){Q=t.value;view();const q=$('#q');q.focus();q.setSelectionRange(Q.length,Q.length);return}
  const k=t.dataset.k;if(!k)return;set(E,k,t.type==='checkbox'?t.checked:t.value);dirty();if(t.hasAttribute('data-grow'))grow(t);
  if(/^posts\.\d+\.title\./.test(k)){const p=E.posts.find(x=>x.id===SEL),b=$('.prow.on b');if(b&&p)b.textContent=t0(p.title)||'(بدون عنوان)'}};
 m.onchange=async e=>{const t=e.target,f=t.files&&t.files[0];if(!f)return;
  if(t.id==='impf'){f.text().then(x=>{$('#imp').value=x});return}
  if(t.id==='mdf'){const ps=await Promise.all([...t.files].map(x=>x.text().then(c=>mdToPost(c,x.name))));ps.reverse().forEach(p=>E.posts.unshift(p));TAB='posts';SEL=ps[ps.length-1].id;dirty();view();toast(ps.length+' پست از فایل‌های مارکداون ساخته شد. بررسی کن و ذخیره کن.');return}
  if(t.id==='mdone'){const i=selIdx(),p=E.posts[i],q=mdToPost(await f.text(),f.name);p.body=q.body;p.lang=q.lang;if(!t0(p.title).trim())p.title=q.title;['fa','en'].forEach(l=>{if(q.desc[l]&&!(p.desc&&p.desc[l]))(p.desc=p.desc||{})[l]=q.desc[l]});dirty();view();toast('متن از فایل بارگذاری شد.');return}
  if(t.id==='imgf'){if(f.size>8e6)return toast('حجم تصویر باید کمتر از ۸ مگابایت باشد',1);try{toast('در حال آپلود تصویر…');const path=await upImg(f);E.posts[selIdx()].image=path;dirty();view();toast('تصویر آپلود شد ✓')}catch(err){toast(err.message||'آپلود نشد',1)}}};
 m.onclick=async e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.tab){TAB=d.tab;SEL=null;view();scrollTo(0,0);return}
  if(d.tf!==undefined){TF=d.tf;view();return}
  if(d.sel){SEL=d.sel;PV=false;view();scrollTo(0,0);return}
  if(d.back){SEL=null;view();return}
  if(d.add){const p={id:nid(),type:TF||'article',listed:true,date:today(),lang:'fa',title:{fa:'',en:''},desc:{fa:'',en:''}};E.posts.unshift(p);SEL=p.id;PV=false;dirty();view();scrollTo(0,0);const f=$('[data-k$=".title.fa"]');f&&f.focus();return}
  if(d.type){E.posts[selIdx()].type=d.type;dirty();view();return}
  if(d.pv!==undefined){PV=d.pv==='1';view();return}
  if(d.md!==undefined){mdIns(d.md);return}
  if(d.addlink){(E.links=E.links||[]).push({label:'',url:''});dirty();view();return}
  if(d.lk){const[a,n]=d.lk.split(':'),i=+n,l=E.links;if(a==='del'){if(!confirm('این لینک حذف شود؟'))return;l.splice(i,1)}else{const j=a==='up'?i-1:i+1;[l[i],l[j]]=[l[j],l[i]]}dirty();view();return}
  if(d.act){const i=selIdx(),p=E.posts[i];
   if(d.act==='del'){if(confirm('این پست حذف شود؟')){E.posts.splice(i,1);SEL=null;dirty();view();toast('پست حذف شد. برای اعمال، ذخیره کن.')}return}
   if(d.act==='upimg'){$('#imgf').click();return}
   if(d.act==='rmimg'){p.image='';dirty();view();return}
   if(d.act==='copy'){clip(shareLink(p.id),'لینک کپی شد ✓');return}
   if(d.act==='icon'){if(!p.url)return toast('اول لینک دمو را وارد کن',1);b.disabled=true;toast('در حال گرفتن آیکون از لینک…');try{p.image=await iconFor(p.url);dirty();view();toast('آیکون گرفته شد ✓')}catch(err){b.disabled=false;toast(err.message||'آیکون پیدا نشد',1)}return}}
  if(d.imp){importJson();return}
  if(d.prompt){clip(PROMPT.replace('{{JSON}}',()=>JSON.stringify(E,null,2)),'پرامپت کپی شد ✓ آخرش زیر «اطلاعات من» توضیحاتت را بنویس.');return}
  if(d.copy){clip(JSON.stringify(E,null,2),'JSON فعلی کپی شد ✓');return}
  if(b.id==='asave'){save();return}
  if(b.id==='out'){if(confirm('از ادمین خارج می‌شوی و توکن از این مرورگر پاک می‌شود. ادامه؟')){ls.del('token');E=null;DIRTY=false;location.hash='#home'}}};
 if(!ATT){ATT=true;
  addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='s'&&route()==='admin'){e.preventDefault();save()}});
  addEventListener('beforeunload',e=>{if(DIRTY){e.preventDefault();e.returnValue=''}})}}

async function admin(){
 document.title='Admin';
 if(!ls.get('token')){loginView();return}
 if(E&&SHA){attach();view();return}
 $('#main').innerHTML='<div class="adm login" dir="rtl"><p class="empty big">در حال بارگذاری…</p></div>';
 try{const r=await gh('GET');SHA=r.sha;E=JSON.parse(decodeURIComponent(escape(atob(r.content.replace(/\s/g,'')))));
  /* migrate the old sections (projects / translations / notes) into one posts list */
  if(!Array.isArray(E.posts)){E.posts=legacy(E);delete E.projects;delete E.translations;delete E.notes}
  E.posts.forEach(p=>{if(!p.id)p.id=nid()});E.links=E.links||[];E.profile=E.profile||{};
  const dr=ls.get('sheibah:draft');
  if(dr){try{const x=JSON.parse(dr);if(JSON.stringify(x)!==JSON.stringify(E)&&confirm('یک پیش‌نویس ذخیره‌نشده از همین مرورگر پیدا شد. بازیابی شود؟')){E=x;DIRTY=true}else ls.del('sheibah:draft')}catch{ls.del('sheibah:draft')}}
  attach();view()}
 catch(e){errorView(e.message)}}

(async()=>{const CK='sheibah:content',c=ls.get(CK);
 if(c){try{D=JSON.parse(c);render()}catch{D=null}}
 const had=!!D;
 try{const r=await fetch('content.json',{cache:'no-cache'});if(!r.ok)throw 0;const t=await r.text();
  if(!had||t!==c){D=JSON.parse(t);ls.set(CK,t);if(!had||route()!=='admin')render()}}
 catch{if(!D)render()}})();
</script>
