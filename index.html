      transition-timing-function: ease-in-out;
      position: absolute;
      display: flex;
      flex-direction: column;

  <script>
    /* Bootstrap: include loader + script-sequencing helper (no third-party deps) */
    (function () {
      "use strict";

      const INCLUDE_SELECTOR = 'link[itemprop="include"]';

      async function readInclude(href) {
        const remote = /^https?:/i.test(href) || location.protocol !== "file:";
        if (remote) {
          const res = await fetch(href);
          if (!res.ok) throw new Error("HTTP " + res.status);
          return res.text();
        }
        const holder = document.getElementById(btoa(encodeURI(href)));
        if (!holder) throw new Error("Inline include not found");
        const raw = holder.getAttribute("value") ?? "";
        return JSON.parse(decodeURI(atob(raw)))?.data ?? "";
      }

      async function loadIncludes() {
        const links = [...document.querySelectorAll(INCLUDE_SELECTOR)];
        await Promise.all(links.map(async (link) => {
          const href = link.getAttribute("href");
          try {
            const html = await readInclude(href);
            link.replaceWith(document.createRange().createContextualFragment(html));
          } catch (err) {
            console.warn("Could not include file:", href, err);
            link.remove();
          }
        }));
      }

      window.waitLoadScripts = function (ids, callback) {
        const scripts = ids
          .map((id) => document.getElementById(id + "-script"))
          .filter(Boolean);

        if (scripts.length === 0) { callback(); return; }

        let remaining = scripts.length;
        const done = () => { if (--remaining === 0) callback(); };

        scripts.forEach((el) => {
          if (el.getAttribute("loaded") === "true" || el.dataset.loaded === "true") {
            done();
          } else {
            el.addEventListener("load", done, { once: true });
            el.addEventListener("error", done, { once: true });
          }
        });
      };

      document.addEventListener("DOMContentLoaded", loadIncludes, { once: true });
    })();
  </script>

  <script>
    (function () {
      const body = document.body;

      const stored = localStorage.getItem("theme");
      const theme = stored || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      body.classList.toggle("theme-dark",  theme === "dark");
      body.classList.toggle("theme-light", theme !== "dark");

      const applyViewportClass = () => {
        const w = window.innerWidth;
        body.classList.remove("is-phone", "is-tablet", "is-small-screen", "is-large-screen");
        body.classList.add(
          w < 480  ? "is-phone" :
          w < 768  ? "is-tablet" :
          w < 1024 ? "is-small-screen" : "is-large-screen"
        );
      };
      applyViewportClass();
      addEventListener("resize", applyViewportClass, { passive: true });
