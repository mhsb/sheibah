<style>

/* ---- soft gradients instead of flat colour ---- */

<script>const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe=u=>/^https?:\/\//i.test(u||'')?esc(u):'#';
const imgsrc=u=>/^(https?:\/\/|img\/)/i.test(u||'')?esc(u):'';
const ls={get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{localStorage.setItem(k,v)}catch{}},del(k){try{localStorage.removeItem(k)}catch{}}};
const U={
en:{all:'All',articles:'Articles',translations:'Translations',projects:'Projects',about:'About',latest:'Latest updates',article:'Article',translation:'Translation',project:'Project',posts:'posts',empty:'Nothing here yet.',back:'Back',demo:'Open',read:'View translation',origin:'Original source',src:'Source code',err:'Could not load content.json. Open the site through GitHub Pages or a local web server, not as a plain file.',rights:'All rights reserved.'},
fa:{all:'همه',articles:'مقاله‌ها',translations:'ترجمه‌ها',projects:'پروژه‌ها',about:'درباره',latest:'آخرین به‌روزرسانی‌ها',article:'مقاله',translation:'ترجمه',project:'پروژه',posts:'پست',empty:'هنوز چیزی اینجا نیست.',back:'بازگشت',demo:'باز کردن',read:'مشاهده‌ی ترجمه',origin:'منبع اصلی',src:'کد منبع',err:'فایل content.json بارگذاری نشد. سایت را از طریق GitHub Pages یا یک وب‌سرور باز کنید، نه به‌صورت فایل ساده.',rights:'همه‌ی حقوق محفوظ است.'}};
let D=null,E=null,SHA='',OPEN='',L=ls.get('lang')||((navigator.language||'').toLowerCase().startsWith('fa')?'fa':'en'),T=U[L];
const TY=['article','translation','project'],FEED=['home',...TY],TABS=['home',...TY,'about'];
const route=()=>(location.hash||'#home').slice(1);
const pick=o=>typeof o==='string'?o:(o&&(o[L]||o.en||o.fa))||'';
const nm=()=>L==='fa'?D.profile.nameFa:D.profile.nameEn;
const fmt=d=>{if(!d)return'';try{return new Intl.DateTimeFormat(L==='fa'?'fa-IR-u-ca-persian':'en-GB',{dateStyle:'long',timeZone:'UTC'}).format(new Date(d))}catch{return d}};
const paras=t=>esc(t).split(/\n{2,}/).map(p=>`<p>${p.replace(/\n/g,'<br>')}</p>`).join('');
const nid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const tlabel=k=>k==='home'?T.all:k==='about'?T.about:T[k+'s'];

/* ---------- data: one list of posts. Old content.json (projects / translations / notes) is converted on the fly ---------- */
function legacy(d){const o=[],s=v=>typeof v==='string'?{en:v,fa:''}:(v||{});
 (d.notes||[]).forEach((x,i)=>o.push({id:'n'+i,type:'article',title:{fa:x.title,en:x.titleEn||''},desc:{},body:x.body,lang:x.lang||'fa',date:x.date||''}));
 (d.translations||[]).forEach((x,i)=>o.push({id:'t'+i,type:'translation',title:s(x.title),desc:x.desc||{},url:x.url,date:x.date||''}));
 (d.projects||[]).forEach((x,i)=>o.push({id:'p'+i,type:'project',title:s(x.name),desc:x.desc||{},url:x.url,repo:x.repo,image:x.image,date:x.date||''}));
 return o}
const posts=()=>(Array.isArray(D.posts)?D.posts:legacy(D)).map(x=>({...x,type:TY.includes(x.type)?x.type:'article'})).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
const ICO={article:'<path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',translation:'<path d="M5 8h8M9 5v3M7 14c2-1 4-3 4-6M7 8c0 3 3 5 6 6"/><path d="M13 20l4-9 4 9M14.5 17h5"/>',project:'<path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/>'};
const thumb=x=>{const u=imgsrc(x.image);return u?`<img src="${u}" alt="" loading="lazy" decoding="async" onerror="this.remove()">`:`<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICO[x.type]}</svg>`};
const excerpt=x=>pick(x.desc)||(x.body||'').replace(/\s+/g,' ').slice(0,150);
const card=(x,i)=>`<a class="card rv t-${x.type}${i===0?' big':''}" href="#p/${encodeURIComponent(x.id)}" style="--i:${Math.min(i,8)}"><div class="top"><span class="th">${thumb(x)}</span><span class="badge">${T[x.type]}</span><time class="muted" datetime="${esc(x.date)}">${fmt(x.date)}</time></div><h2 dir="auto">${esc(pick(x.title))}</h2><p dir="auto">${esc(excerpt(x))}</p></a>`;
const page=(t,i,b)=>`<div class="page wrap rv"><h1>${t}</h1><p class="lede">${i}</p>${b}</div>`;

async function findIcon(pageUrl){
 const abs=(u,b)=>{try{return new URL(u,b).href}catch{return null}};
 const sz=a=>Math.max(0,...String(a||'').split(/\s+/).map(x=>parseInt(x)||0));
 const r=await fetch(pageUrl);if(!r.ok)throw new Error('صفحه‌ی پروژه باز نشد ('+r.status+')');
 const base=r.url||pageUrl,doc=new DOMParser().parseFromString(await r.text(),'text/html'),c=[];
 const man=doc.querySelector('link[rel~=manifest]');
 if(man){try{const mu=abs(man.getAttribute('href'),base),m=await(await fetch(mu)).json();(m.icons||[]).forEach(i=>c.push([sz(i.sizes)-(/maskable/.test(i.purpose||'')&&!/any/.test(i.purpose||'')?1000:0),abs(i.src,mu)]))}catch{}}
 doc.querySelectorAll('link[rel~=apple-touch-icon]').forEach(l=>c.push([sz(l.getAttribute('sizes'))||180,abs(l.getAttribute('href'),base)]));
 doc.querySelectorAll('link[rel~=icon]').forEach(l=>c.push([sz(l.getAttribute('sizes'))||16,abs(l.getAttribute('href'),base)]));
 c.push([1,abs('favicon.ico',base)]);
 return c.filter(x=>x[1]).sort((a,b)=>b[0]-a[0]).map(x=>x[1])}

const PROMPT=`تو دستیار تنظیم محتوای یک وب‌لاگ شخصی دوزبانه (فارسی/انگلیسی) هستی. بر اساس «اطلاعات من» که در پایان این پیام می‌آید، فقط یک JSON معتبر تولید کن.

قواعد خروجی:
- فقط خود JSON؛ بدون توضیح، بدون بک‌تیک و بدون کامنت.
- فقط این کلیدهای سطح اول مجازند: profile، links، posts. بخشی را که تغییر نمی‌دهم نیاور.
- هر پست یکی از سه نوع است: "article" (مقاله)، "translation" (ترجمه)، "project" (پروژه).
- عنوان و خلاصه‌ی هر پست دوزبانه باشد (title.fa و title.en، desc.fa و desc.en). ترجمه را طبیعی و روان بنویس، نه تحت‌اللفظی.
- خلاصه ۱ تا ۳ جمله باشد.
- date به شکل YYYY-MM-DD باشد (تاریخ انتشار یا آخرین به‌روزرسانی). اگر نمی‌دانی، خالی بگذار.
- برای article، متن کامل را در body بنویس (پاراگراف‌ها با یک خط خالی، یعنی \\n\\n، جدا شوند؛ بدون HTML و مارک‌داون) و زبان آن را در lang بگذار ("fa" یا "en").
- برای translation، url لینک محل انتشار ترجمه است. برای project، url لینک دمو و repo آدرس گیت‌هاب است.
- آدرس‌ها کامل و با https:// باشند. آدرسی را که نمی‌دانی حدس نزن؛ رشته‌ی خالی بگذار.
- در links آیتم اول دکمه‌ی «ارتباط با من» است؛ مهم‌ترین راه ارتباطی را اول بگذار.
- فیلدهای id و image را نیاور (خودکار ساخته می‌شوند).
- چیزی درباره‌ی من اختراع نکن؛ فقط از اطلاعاتی که می‌دهم استفاده کن. اگر اطلاعاتی کم بود، همان فیلد را خالی بگذار.

  return `<div class="sec"><h2>${t}</h2>${(E[k]||[]).map((it,i)=>`<details class="item"${OPEN===k+'.'+i?' open':''}><summary>${esc(ttl(it)||'(بدون عنوان)')}</summary>${f.map(x=>fld(k+'.'+i,x,it)).join('')}<button class="btn ghost danger" data-del="${k}.${i}">حذف</button></details>`).join('')}<button class="btn ghost" data-add="${k}">+ افزودن</button></div>`;
 };
 shell(`<details class="item"><summary>درون‌ریزی از JSON (مثلاً خروجی هوش مصنوعی)</summary><label>JSON را اینجا بچسبان<textarea id="imp" dir="ltr" style="min-height:10rem" placeholder='{"profile":{…},"posts":[…]}'></textarea></label><label class="up">یا فایل JSON انتخاب کن<input type="file" id="impf" accept=".json,application/json"></label><label class="chk"><input type="checkbox" id="impa"><span>به موارد فعلی اضافه کن (جایگزین نکن)</span></label><p><button class="btn" data-imp="1">اعمال روی فرم‌ها</button> <button class="btn ghost" data-copy="1">کپی JSON فعلی</button> <button class="btn ghost" data-prompt="1">کپی پرامپت آماده</button></p></details>${SCHEMA.map(sec).join('')}<p><button class="btn" id="save">ذخیره و انتشار</button> <button class="btn ghost" id="out">خروج</button></p><p id="msg" role="status"></p><p class="muted">بعد از ذخیره، حدود یک دقیقه طول می‌کشد تا سایت به‌روز شود.</p>`);
 const m=$('#main');
 m.oninput=e=>{const k=e.target.dataset.k;if(!k)return;set(E,k,e.target.type==='checkbox'?e.target.checked:e.target.value)};
 m.onchange=async e=>{const t=e.target;
  if(t.id==='impf'){const f=t.files[0];if(f)f.text().then(x=>{$('#imp').value=x});return}
  const f=t.files&&t.files[0],k=t.dataset.up;if(!f||!k)return;
  if(f.size>8e6)return msg('حجم تصویر باید کمتر از ۸ مگابایت باشد',1);
  try{msg('در حال آپلود تصویر…');const path=await upImg(f);set(E,k,path);const inp=m.querySelector(`[data-k="${k}"]`);if(inp)inp.value=path;msg('تصویر آپلود شد ✓ حالا «ذخیره و انتشار» را بزن.')}
  catch(err){msg(err.message||'آپلود نشد',1)}t.value=''};
 m.onclick=async e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.imp)return importJson();
  if(b.dataset.icon){const base=b.dataset.icon,pr=get(E,base);if(!pr||!pr.url)return msg('اول «لینک (دمو پروژه)» را وارد کن',1);
   b.disabled=true;msg('در حال گرفتن آیکون از لینک…');
   try{pr.image=await iconFor(pr.url);OPEN=base;draw();msg('آیکون گرفته شد ✓ حالا «ذخیره و انتشار» را بزن.')}catch(err){msg(err.message||'آیکون پیدا نشد',1)}b.disabled=false;return}
  if(b.dataset.prompt){const tx=PROMPT.replace('{{JSON}}',()=>JSON.stringify(E,null,2));return navigator.clipboard.writeText(tx).then(()=>msg('پرامپت کپی شد ✓ آخرش زیر «اطلاعات من» توضیحاتت را بنویس.')).catch(()=>{$('#imp').value=tx;msg('کپی خودکار نشد؛ پرامپت در کادر بالا قرار گرفت',1)})}
  if(b.dataset.copy){const tx=JSON.stringify(E,null,2);return navigator.clipboard.writeText(tx).then(()=>msg('JSON فعلی کپی شد ✓')).catch(()=>{$('#imp').value=tx;msg('کپی خودکار نشد؛ متن در کادر قرار گرفت',1)})}
  if(b.dataset.add){const k=b.dataset.add,def=k==='posts'?{id:nid(),type:'article',date:new Date().toISOString().slice(0,10),lang:'fa',title:{fa:'',en:''},desc:{fa:'',en:''}}:{};(E[k]=E[k]||[]).unshift(def);OPEN=k+'.0';draw()}
  else if(b.dataset.del){const[k,i]=b.dataset.del.split('.');if(confirm('حذف شود؟')){E[k].splice(+i,1);OPEN='';draw()}}
  else if(b.id==='out'){ls.del('token');location.hash='#home'}
  else if(b.id==='save'){
   const bad=[E.links,E.posts].flatMap(a=>(a||[]).flatMap(x=>[x.url,x.repo])).find(u=>u&&!/^https?:\/\//i.test(u));
   if(bad)return msg('همه‌ی آدرس‌ها باید با http:// یا https:// شروع شوند: '+bad,1);
   if((E.links||[]).some(l=>!l.url))return msg('هر لینک باید آدرس داشته باشد',1);
   if((E.posts||[]).some(p=>!t0(p.title).trim()))return msg('هر پست باید حداقل یک عنوان (فارسی یا انگلیسی) داشته باشد',1);
   for(const pr of(E.posts||[])){if(pr.type==='project'&&pr.url&&!pr.image&&!TRIED.has(pr.url)){TRIED.add(pr.url);try{msg('در حال گرفتن آیکون '+t0(pr.title)+'…');pr.image=await iconFor(pr.url)}catch{}}}
   b.disabled=true;msg('در حال ذخیره…');
   try{const r=await gh('PUT',{message:'Update content via admin',branch:D.branch||'main',sha:SHA,content:btoa(unescape(encodeURIComponent(JSON.stringify(E,null,2)+'\n')))});SHA=r.content.sha;D=JSON.parse(JSON.stringify(E));msg('ذخیره شد ✓ تا حدود یک دقیقه دیگر روی سایت دیده می‌شود.')}
   catch(err){msg(err.message,1)}b.disabled=false}};
}

(async()=>{const CK='sheibah:content',c=ls.get(CK);
 if(c){try{D=JSON.parse(c);render()}catch{D=null}}
 const had=!!D;
 try{const r=await fetch('content.json',{cache:'no-cache'});if(!r.ok)throw 0;const t=await r.text();
  if(!had||t!==c){D=JSON.parse(t);ls.set(CK,t);if(!had||route()!=='admin')render()}}
 catch{if(!D)render()}})();
</script>
