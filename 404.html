<script>
/* Short links: sheibah.ir/my-post  ->  sheibah.ir/#p/my-post  (GitHub Pages serves this file for unknown paths) */
var s=location.pathname.replace(/^\/+|\/+$/g,'');
if(/^[a-z0-9][a-z0-9-]*$/i.test(s)){location.replace('/#p/'+s)}
else{document.getElementById('m').innerHTML='صفحه پیدا نشد. <a href="/">بازگشت به سایت</a>'}
</script>
